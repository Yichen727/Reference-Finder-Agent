[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atomized-reference-finder"
version = "0.1.0"
description = "Streamlit and FastAPI foundation for creative reference research"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "streamlit>=1.67,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "openai>=1.68,<3",
  "python-docx>=1.1,<2",
  "pillow>=11,<14",
  "lxml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.setuptools.package-data]
frontend = ["workspace.css", "pack_assets/*.js", "pack_assets/*.css"]
backend = ["templates/*.pptx", "templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
